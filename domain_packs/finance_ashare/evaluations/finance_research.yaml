evaluation_id: finance.research.smoke.v1
mode: execution
objective: Execute the Finance Pack report composition smoke path.
intent: stock_check
available_artifact_types: [user_request, snapshot, stock_snapshot_bundle]
required_artifact_types: [research_report]
seed_artifacts:
  - artifact_type: user_request
    content:
      query: Analyze 600000 with the Finance Pack smoke fixture.
      symbols: ["600000"]
    source_refs:
      - type: evaluation_fixture
        id: finance-research-request
  - artifact_type: snapshot
    content:
      snapshot_type: market
      scope: symbol
      symbol: "600000"
      quality_status: available
      facts:
        market_overview: {latest_price: 10.0}
    source_refs:
      - type: evaluation_fixture
        id: finance-research-market
  - artifact_type: snapshot
    content:
      snapshot_type: fundamental
      scope: symbol
      symbol: "600000"
      quality_status: available
      facts:
        financial_abstract: {operating_cash_flow: 160.0, revenue: 1000.0}
    source_refs:
      - type: evaluation_fixture
        id: finance-research-fundamental
  - artifact_type: stock_snapshot_bundle
    content:
      query: Evaluation fixture for a single A-share symbol.
      symbols: ["600000"]
      snapshots:
        - snapshot_type: market
          symbol: 600000
          facts:
            market_overview:
              latest_price: 10.0
      candidate_universe: []
      collection:
        universe_source: evaluation_fixture
        candidate_count: 1
        requested_snapshot_types: [market]
        collected_snapshot_types: [market]
        enrichment_targets: []
        degraded: false
    source_refs:
      - type: evaluation_fixture
        id: finance-research-smoke
required_gate_id: finance.sources_required
expected_status: completed
expected_gate_verdicts:
  finance.sources_required: pass
required_event_types: [graph_node_completed]
