quality_gates:
  - gate_id: finance.sources_required
    artifact_type: research_report
    blocking: true
    description: Research reports require traceable evidence sources.
  - gate_id: finance.research_safety
    artifact_type: research_report
    evaluator_capability: finance.report.safety.gate
    blocking: true
    description: Research reports must pass source and professional risk checks.
  - gate_id: finance.uzi.native.critical
    artifact_type: research_report
    evaluator_capability: finance.uzi.native.report.gate
    blocking: true
    description: Native UZI reports require critical_count=0 and report_allowed=true.
  - gate_id: finance.screening.quality
    artifact_type: screening_result
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Screening outputs must preserve candidate evidence, ranking inputs and data gaps.
    config:
      allowed_quality_statuses: [available, degraded, data_gap]
  - gate_id: finance.fund.analysis
    artifact_type: fund_analysis
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Fund selection must expose comparable sample size, observed fields, score coverage and data gaps.
    config:
      allowed_quality_statuses: [available, degraded, data_gap]
  - gate_id: finance.sector.analysis
    artifact_type: sector_analysis
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Sector analysis must preserve constituent, heatmap and catalyst provenance.
    config:
      allowed_quality_statuses: [available, degraded, data_gap]
  - gate_id: finance.thesis.review
    artifact_type: thesis_review
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Thesis review must preserve claim-level evidence, counterevidence and gaps.
    config:
      allowed_quality_statuses: [available, degraded, data_gap]
report_contracts:
  - contract_id: finance.research_report.v1
    artifact_type: research_report
    required_sections: [conclusion, evidence, risk, follow_up]
    required_source_refs: true
    required_gate_ids: [finance.sources_required, finance.research_safety, finance.uzi.native.critical]
planner_policies:
  prefer_evidence_backed_paths: true
  profile_intents: [stock_check, stock_compare, uzi_portfolio_batch, stock_screen, sector_research, review_thesis]
  profile_output_intents: [stock_check, stock_compare, uzi_portfolio_batch]
  progress_policy:
    max_model_updates: 12
    max_tokens: 1200
    min_interval_seconds: 1.0
    timeout_seconds: 8.0
    fallback: structured
  snapshot_dimensions:
    - market
    - fundamental
    - notice
    - lhb
    - capital_flow
    - sentiment
    - events
    - kline
    - macro
    - peers
    - chain
    - research
    - industry
    - materials
    - futures
    - valuation
    - governance
    - moat
    - trap
    - contests
    - sector
    - policy
    - fund_holders
    - similar_stocks
  research_profiles:
    lite:
      max_cost_class: medium
      max_latency_class: medium
      estimated_duration_seconds: 120
      deadline_policy: unbounded
      allowed_capability_tags: [profile:lite]
      methods: []
    medium:
      max_cost_class: high
      max_latency_class: high
      estimated_duration_seconds: 480
      deadline_policy: unbounded
      allowed_capability_tags: [profile:lite, profile:medium]
      methods: []
    deep:
      max_cost_class: high
      max_latency_class: high
      estimated_duration_seconds: 1200
      deadline_policy: unbounded
      allowed_capability_tags: [profile:lite, profile:medium, profile:deep]
      methods: []
  profile_outputs:
    lite: [research_report]
    medium: [research_report]
    deep: [research_report]
  intent_outputs:
    quick_scan: [quick_scan]
    fund_research: [fund_analysis, research_report]
    stock_screen: [screening_result]
    sector_research: [sector_analysis]
    review_thesis: [thesis_review]
    distill_kol_logic: [distillation_result, distillation_review]
  intent_capabilities:
    distill_kol_logic:
      - finance.distillation.report.compose
evaluations:
  - evaluations/finance_research.yaml
  - evaluations/finance_research_failure.yaml
governance:
  max_nodes: 128
  max_depth: 12
  max_concurrency: 16
  max_retries_per_node: 2
  required_gate_ids: []
  allowed_tools: [financial_data_provider, fund_data_provider]
  allowed_permissions: [finance:data:read]
metadata:
  migration:
    uzi_source_mapping: migration/uzi_source_mapping.yaml
    uzi_source_mapping_schema: migration/uzi_source_mapping.schema.json
    uzi_source_mapping_schema_version: "3"
    source_commit: b004d7a988ca53a4805bf36784af091fa1209f22
    methodology_version: 3.9.4-source-parity
  dashboard_views:
    overview:
      resources:
        candidates:
          source: artifacts
          artifact_type: screening_result
          content_path: screened_candidates
          selection: latest_artifact
          limit: 4
        sector_heatmap:
          source: artifacts
          artifact_type: sector_analysis
          content_path: sector_heatmap
          selection: latest_per_item_key
          item_key: name
          limit: 7
    screening:
      resources:
        candidates:
          source: artifacts
          artifact_type: screening_result
          content_path: screened_candidates
          selection: latest_artifact
        watchlist_candidates:
          source: artifacts
          artifact_type: screening_result
          content_path: watchlist_candidates
          selection: latest_artifact
        scorecard:
          source: artifacts
          artifact_type: screening_result
          content_path: scorecard
          selection: latest_artifact
          limit: 1
        methodology:
          source: manifest
          value:
            name: A-share evidence-backed screening
            version: 1
            screen_styles:
              - id: value
                name: Value
                purpose: Prefer candidates with traceable valuation evidence.
              - id: growth
                name: Growth
                purpose: Require reported growth evidence before ranking growth claims.
              - id: quality
                name: Quality
                purpose: Prioritize profitability and cash-flow evidence coverage.
              - id: gulp
                name: GULP
                purpose: Cross-check growth, valuation, liquidity, and price evidence.
              - id: short
                name: Short risk review
                purpose: Surface downside and disclosure evidence gaps without simulating a trade.
    methodology:
      resources:
        profile:
          source: manifest
          value:
            name: A-share evidence-backed research
            version: 1
            description: Professional screening profiles are selected explicitly and never fill missing evidence with neutral scores.
            screen_styles:
              - id: value
                name: Value
                purpose: Prefer candidates with traceable valuation evidence.
              - id: growth
                name: Growth
                purpose: Require reported growth evidence before ranking growth claims.
              - id: quality
                name: Quality
                purpose: Prioritize profitability and cash-flow evidence coverage.
              - id: gulp
                name: GULP
                purpose: Cross-check growth, valuation, liquidity, and price evidence.
              - id: short
                name: Short risk review
                purpose: Surface downside and disclosure evidence gaps without simulating a trade.
            guardrails:
              - Hard data and source provenance are required for reusable conclusions.
              - Missing facts remain explicit data gaps and reduce confidence.
              - Conflicting valuation evidence is preserved for professional review.
              - High-impact methodology changes require evaluation and human approval before promotion.
        verified_policy_memory:
          source: memory
          layer: policy
          statuses: [verified, promoted]
          limit: 10
