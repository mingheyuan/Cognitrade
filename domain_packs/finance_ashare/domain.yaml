quality_gates:
  - gate_id: finance.sources_required
    artifact_type: research_report
    blocking: true
    description: Research reports require traceable evidence sources.
  - gate_id: finance.research_safety
    artifact_type: research_report
    evaluator_capability: finance.report.safety.gate
    blocking: true
    description: Research reports must pass source and professional risk checks.
  - gate_id: finance.valuation.input
    artifact_type: valuation_model
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Valuation outputs must expose input quality and assumption status.
    config:
      allowed_quality_statuses: [available, degraded, assumption_only, data_gap]
  - gate_id: finance.methodology.input
    artifact_type: institutional_analysis
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Institutional method outputs must expose input quality and assumptions.
    config:
      allowed_quality_statuses: [available, degraded, assumption_only, data_gap]
  - gate_id: finance.financial.input
    artifact_type: financial_analysis
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Reusable financial methods must expose input quality and assumptions.
    config:
      allowed_quality_statuses: [available, degraded, assumption_only, data_gap]
  - gate_id: finance.workflow.input
    artifact_type: research_workflow
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Research workflow outputs must expose source coverage and gaps.
    config:
      allowed_quality_statuses: [available, degraded, assumption_only, data_gap]
  - gate_id: finance.deep.input
    artifact_type: deep_analysis
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Deep analysis outputs must expose method and evidence limitations.
    config:
      allowed_quality_statuses: [available, degraded, assumption_only, data_gap]
  - gate_id: finance.dimension.coverage
    artifact_type: uzi_dimension_coverage
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Dimension coverage must separate source dimensions from derived products.
    config:
      allowed_quality_statuses: [available, degraded, data_gap]
  - gate_id: finance.panel.lineage
    artifact_type: investor_panel_review
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Panel outputs must preserve methodology lineage and evidence status.
    config:
      allowed_quality_statuses: [available, degraded, data_gap]
  - gate_id: finance.risk.evidence
    artifact_type: risk_scan
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Risk outputs must distinguish observed signals from data gaps.
    config:
      allowed_quality_statuses: [available, degraded, data_gap]
  - gate_id: finance.screening.quality
    artifact_type: screening_result
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Screening outputs must preserve candidate evidence, ranking inputs and data gaps.
    config:
      allowed_quality_statuses: [available, degraded, data_gap]
  - gate_id: finance.fund.analysis
    artifact_type: fund_analysis
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Fund selection must expose comparable sample size, observed fields, score coverage and data gaps.
    config:
      allowed_quality_statuses: [available, degraded, data_gap]
  - gate_id: finance.sector.analysis
    artifact_type: sector_analysis
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Sector analysis must preserve constituent, heatmap and catalyst provenance.
    config:
      allowed_quality_statuses: [available, degraded, data_gap]
  - gate_id: finance.thesis.review
    artifact_type: thesis_review
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Thesis review must preserve claim-level evidence, counterevidence and gaps.
    config:
      allowed_quality_statuses: [available, degraded, data_gap]
  - gate_id: finance.presentation.lineage
    artifact_type: report_presentation
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Presentation must reference the same active semantic artifacts.
    config:
      allowed_quality_statuses: [available, degraded, assumption_only, data_gap]
  - gate_id: finance.tier1.ai_readiness
    artifact_type: ai_readiness
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: AI readiness gates must distinguish observed pass/fail evidence from missing provider data.
    config:
      allowed_quality_statuses: [available, degraded, data_gap]
  - gate_id: finance.tier1.earnings_preview
    artifact_type: earnings_preview
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Earnings previews must separate reported facts, consensus observations and labeled scenarios.
    config:
      allowed_quality_statuses: [available, degraded, assumption_only, data_gap]
  - gate_id: finance.tier1.model_update
    artifact_type: model_update
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Model updates require explicit user assumptions and cannot infer demo deltas from missing inputs.
    config:
      allowed_quality_statuses: [available, degraded, assumption_only, data_gap]
  - gate_id: finance.tier1.returns_attribution
    artifact_type: returns_attribution
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Missing holding returns must reduce coverage and cannot be counted as zero contribution.
    config:
      allowed_quality_statuses: [available, degraded, data_gap]
  - gate_id: finance.tier1.holding_rebalance
    artifact_type: holding_rebalance
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Rebalance outputs must expose target policy, value coverage and the supplied fee model.
    config:
      allowed_quality_statuses: [available, degraded, assumption_only, data_gap]
  - gate_id: finance.uzi.portfolio_rebalance
    artifact_type: portfolio_rebalance
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Strategic allocation rebalancing requires explicit asset classes and policy targets.
    config: {allowed_quality_statuses: [available, degraded, assumption_only, data_gap]}
  - gate_id: finance.uzi.three_statement
    artifact_type: three_statement_model
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Three-statement projections require observed financial anchors and explicit assumptions.
    config: {allowed_quality_statuses: [available, degraded, assumption_only, data_gap]}
  - gate_id: finance.uzi.quick_lbo
    artifact_type: quick_lbo
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: LBO calculations require reported EBITDA and explicit transaction assumptions.
    config: {allowed_quality_statuses: [available, degraded, assumption_only, data_gap]}
  - gate_id: finance.uzi.accretion_dilution
    artifact_type: accretion_dilution
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Accretion and dilution outputs require explicit transaction inputs.
    config: {allowed_quality_statuses: [available, degraded, assumption_only, data_gap]}
  - gate_id: finance.uzi.segmental
    artifact_type: segmental_model
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Segment analysis may use only reported segment rows.
    config: {allowed_quality_statuses: [available, degraded, data_gap]}
  - gate_id: finance.uzi.initiation_report
    artifact_type: initiation_report
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Initiation coverage exposes evidence coverage and missing sections.
    config: {allowed_quality_statuses: [available, degraded, data_gap]}
  - gate_id: finance.uzi.earnings_review
    artifact_type: earnings_review
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Earnings review separates reported actuals from observed consensus.
    config: {allowed_quality_statuses: [available, degraded, data_gap]}
  - gate_id: finance.uzi.catalyst_calendar
    artifact_type: catalyst_calendar
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Catalyst calendars require dated event evidence.
    config: {allowed_quality_statuses: [available, degraded, data_gap]}
  - gate_id: finance.uzi.thesis_tracker
    artifact_type: thesis_tracker
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Thesis pillars preserve evidence status for each claimed driver.
    config: {allowed_quality_statuses: [available, degraded, data_gap]}
  - gate_id: finance.uzi.morning_note
    artifact_type: morning_note
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Morning notes identify unavailable market, flow, sentiment and event inputs.
    config: {allowed_quality_statuses: [available, degraded, data_gap]}
  - gate_id: finance.uzi.ic_memo
    artifact_type: ic_memo
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: IC memos remain decision support and cannot synthesize an unsupported recommendation.
    config: {allowed_quality_statuses: [available, degraded, assumption_only, data_gap]}
  - gate_id: finance.uzi.porter_bcg
    artifact_type: porter_bcg
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Competitive analysis cannot substitute neutral default scores for missing evidence.
    config: {allowed_quality_statuses: [available, degraded, data_gap]}
  - gate_id: finance.uzi.dd_checklist
    artifact_type: dd_checklist
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Due diligence coverage must expose every unavailable evidence workstream.
    config: {allowed_quality_statuses: [available, degraded, data_gap]}
  - gate_id: finance.uzi.unit_economics
    artifact_type: unit_economics
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Unit economics require observed customer, churn, margin and acquisition-cost inputs.
    config: {allowed_quality_statuses: [available, degraded, data_gap]}
  - gate_id: finance.uzi.value_creation_plan
    artifact_type: value_creation_plan
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Value creation plans require explicit levers and never fabricate EBITDA impacts.
    config: {allowed_quality_statuses: [available, degraded, assumption_only, data_gap]}
report_contracts:
  - contract_id: finance.research_report.v1
    artifact_type: research_report
    required_sections: [conclusion, evidence, risk, follow_up]
    required_source_refs: true
    required_gate_ids: [finance.sources_required, finance.research_safety]
  - contract_id: finance.report_presentation.v1
    artifact_type: report_presentation
    required_sections: [theme, profile, hero, core_conclusion, source_artifact_ids, data_gap]
    required_source_refs: true
    required_gate_ids: [finance.presentation.lineage]
planner_policies:
  prefer_evidence_backed_paths: true
  profile_intents: [stock_check, stock_compare, stock_screen, sector_research, review_thesis]
  profile_output_intents: [stock_check, stock_compare]
  progress_policy:
    max_model_updates: 12
    max_tokens: 1200
    min_interval_seconds: 1.0
    timeout_seconds: 8.0
    fallback: structured
  snapshot_dimensions:
    - market
    - fundamental
    - notice
    - lhb
    - capital_flow
    - sentiment
    - events
    - kline
    - macro
    - peers
    - chain
    - research
    - industry
    - materials
    - futures
    - valuation
    - governance
    - moat
    - trap
    - contests
    - sector
    - policy
    - fund_holders
    - similar_stocks
  research_profiles:
    lite:
      max_cost_class: medium
      max_latency_class: medium
      max_duration_seconds: 120
      allowed_capability_tags: [profile:lite]
      methods: [dcf]
    medium:
      max_cost_class: high
      max_latency_class: high
      max_duration_seconds: 480
      allowed_capability_tags: [profile:lite, profile:medium]
      methods: [dcf, comps, panel, risk, institutional, workflow, dimensions]
    deep:
      max_cost_class: high
      max_latency_class: high
      max_duration_seconds: 1200
      allowed_capability_tags: [profile:lite, profile:medium, profile:deep]
      methods: [dcf, comps, panel, risk, institutional, workflow, deep, dimensions]
  profile_outputs:
    lite: [research_report, report_presentation, valuation_model, investor_panel_review, risk_scan]
    medium: [research_report, report_presentation, valuation_model, investor_panel_review, risk_scan, institutional_analysis, research_workflow, uzi_dimension_coverage]
    deep: [research_report, report_presentation, valuation_model, investor_panel_review, risk_scan, institutional_analysis, research_workflow, deep_analysis, uzi_dimension_coverage]
  methodology_outputs:
    dcf: [valuation_model]
    comps: [valuation_model]
    cashflow_resilience: [financial_analysis]
    three_statement: [three_statement_model]
    lbo: [quick_lbo]
    quick_lbo: [quick_lbo]
    ma_accretion: [accretion_dilution]
    accretion_dilution: [accretion_dilution]
    segmental: [segmental_model]
    initiation_report: [initiation_report]
    earnings_review: [earnings_review]
    catalyst_calendar: [catalyst_calendar]
    thesis_tracker: [thesis_tracker]
    morning_note: [morning_note]
    ic_memo: [ic_memo]
    porter_bcg: [porter_bcg]
    dd_checklist: [dd_checklist]
    unit_economics: [unit_economics]
    value_creation_plan: [value_creation_plan]
    panel: [investor_panel_review]
    risk: [risk_scan]
    report: [research_report]
    institutional: [institutional_analysis]
    workflow: [research_workflow]
    deep: [deep_analysis]
    dimensions: [uzi_dimension_coverage]
    ai_readiness: [ai_readiness]
    earnings_preview: [earnings_preview]
    model_update: [model_update]
    returns_attribution: [returns_attribution]
    holding_rebalance: [holding_rebalance]
    portfolio_rebalance: [portfolio_rebalance]
  method_catalog:
    dcf:
      output_artifact_types: [valuation_model]
      capability: finance.uzi.valuation.evaluate
      required_inputs:
        - artifact_type: snapshot
          selector: {snapshot_type: fundamental, scope: symbol}
          required_fields:
            - {path: facts.financial_abstract.operating_cash_flow, type: number, unit: CNY_100M, aliases: [facts.financial_abstract.free_cash_flow]}
        - artifact_type: snapshot
          selector: {snapshot_type: market, scope: symbol}
          required_fields:
            - {path: facts.market_overview.latest_price, type: number, unit: CNY}
      required_gate_ids: [finance.valuation.input]
      allowed_quality_statuses: [available, degraded, assumption_only]
      result_equivalence: {level: numeric_tolerance, baseline_fixture: tests/fixtures/uzi_methodology_baseline.json, tolerance: 0.5}
    comps:
      output_artifact_types: [valuation_model]
      capability: finance.uzi.valuation.evaluate
      required_inputs:
        - artifact_type: snapshot
          selector: {snapshot_type: peers, scope: symbol}
          required_fields:
            - {path: facts, type: object}
      required_gate_ids: [finance.valuation.input]
      allowed_quality_statuses: [available, degraded]
      result_equivalence: {level: numeric_tolerance, baseline_fixture: tests/fixtures/uzi_finance_snapshot_replay.json, tolerance: 0.1}
    cashflow_resilience:
      output_artifact_types: [financial_analysis]
      capability: finance.analysis.evaluate
      required_inputs:
        - artifact_type: snapshot
          selector: {snapshot_type: fundamental, scope: symbol}
          required_fields:
            - {path: facts.financial_abstract.operating_cash_flow, type: number, unit: CNY_100M}
      required_gate_ids: [finance.financial.input]
      allowed_quality_statuses: [available, degraded, assumption_only]
      result_equivalence: {level: semantic, baseline_fixture: tests/fixtures/uzi_finance_snapshot_replay.json}
    three_statement:
      output_artifact_types: [three_statement_model]
      capability: finance.uzi.method.three_statement
      required_inputs:
        - artifact_type: snapshot
          selector: {snapshot_type: fundamental, scope: symbol}
          required_fields:
            - {path: facts.financial_abstract, type: object, source_required: false}
      required_gate_ids: [finance.uzi.three_statement]
      allowed_quality_statuses: [available, degraded, assumption_only, data_gap]
      result_equivalence: {level: semantic, baseline_fixture: tests/fixtures/uzi_finance_snapshot_replay.json}
    lbo:
      output_artifact_types: [quick_lbo]
      capability: finance.uzi.method.quick_lbo
      required_inputs:
        - artifact_type: snapshot
