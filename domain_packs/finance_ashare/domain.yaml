domain_id: finance_ashare
version: 0.1.0
description: A-share evidence-backed professional research pack.
artifact_types:
  - artifact_type: user_request
  - artifact_type: normalized_query
  - artifact_type: stock_snapshot_bundle
  - artifact_type: evidence_set
  - artifact_type: financial_analysis
  - artifact_type: screening_result
  - artifact_type: sector_analysis
  - artifact_type: thesis_review
  - artifact_type: source_record_set
  - artifact_type: distillation_result
  - artifact_type: distillation_review
  - artifact_type: research_report
capabilities:
  - subagent_type: query_normalizer
    capability: finance.query.normalize
    implementation: subagents.runtime:normalize_query
    consumes:
      - artifact_type: user_request
    produces:
      - artifact_type: normalized_query
    cost_class: low
    latency_class: low
    reliability: 0.99
    cache_scope: global
  - subagent_type: stock_snapshot_collector
    capability: finance.ashare.snapshot.collect
    implementation: subagents.runtime:collect_snapshot
    consumes:
      - artifact_type: normalized_query
    produces:
      - artifact_type: stock_snapshot_bundle
    tools:
      - financial_data_provider
    side_effect_level: read_only
    parallel_safe: true
    max_concurrency: 8
    cost_class: medium
    latency_class: medium
    reliability: 0.9
    cache_scope: run
  - subagent_type: retrieval_decider
    capability: evidence.select
    implementation: subagents.runtime:select_evidence
    consumes:
      - artifact_type: stock_snapshot_bundle
    produces:
      - artifact_type: evidence_set
    requires_llm: true
    cost_class: medium
    latency_class: medium
    reliability: 0.85
    cache_scope: run
  - subagent_type: financial_analyst
    capability: finance.analysis.evaluate
    implementation: subagents.runtime:analyze_financials
    consumes:
      - artifact_type: stock_snapshot_bundle
    produces:
      - artifact_type: financial_analysis
    reliability: 0.92
    cache_scope: run
  - subagent_type: stock_screen_analyzer
    capability: finance.stock.screen
    implementation: subagents.runtime:screen_stocks
    consumes:
      - artifact_type: stock_snapshot_bundle
    produces:
      - artifact_type: screening_result
    parallel_safe: true
    reliability: 0.9
    cache_scope: run
    tags: [intent:stock_screen]
  - subagent_type: sector_research_analyzer
    capability: finance.sector.research
    implementation: subagents.runtime:research_sector
    consumes:
      - artifact_type: stock_snapshot_bundle
    produces:
      - artifact_type: sector_analysis
    parallel_safe: true
    reliability: 0.9
    cache_scope: run
    tags: [intent:sector_research]
  - subagent_type: thesis_reviewer
    capability: finance.thesis.review
    implementation: subagents.runtime:review_thesis
    consumes:
      - artifact_type: evidence_set
    produces:
      - artifact_type: thesis_review
    reliability: 0.9
    cache_scope: run
    tags: [intent:review_thesis]
  - subagent_type: distillation_source_collector
    capability: finance.distillation.sources.collect
    implementation: subagents.runtime:collect_distillation_sources
    consumes:
      - artifact_type: normalized_query
    produces:
      - artifact_type: source_record_set
    reliability: 0.98
    cache_scope: run
    tags: [intent:distill_kol_logic]
  - subagent_type: kol_logic_distiller
    capability: finance.kol.logic.distill
    implementation: subagents.runtime:distill_kol_logic
    consumes:
      - artifact_type: source_record_set
    produces:
      - artifact_type: distillation_result
    parallel_safe: true
    reliability: 0.9
    cache_scope: run
    tags: [intent:distill_kol_logic]
  - subagent_type: distillation_reviewer
    capability: finance.distillation.review
    implementation: subagents.runtime:review_distillation
    consumes:
      - artifact_type: distillation_result
    produces:
      - artifact_type: distillation_review
    reliability: 0.92
    cache_scope: run
    tags: [intent:distill_kol_logic]
  - subagent_type: distillation_report_composer
    capability: finance.distillation.report.compose
    implementation: subagents.runtime:compose_distillation_report
    consumes:
      - artifact_type: distillation_review
    produces:
      - artifact_type: research_report
    reliability: 0.9
    cache_scope: run
    tags: [intent:distill_kol_logic]
  - subagent_type: llm_report_composer
    capability: finance.report.compose
    implementation: subagents.runtime:compose_report
    consumes:
      - artifact_type: evidence_set
      - artifact_type: financial_analysis
    produces:
      - artifact_type: research_report
    requires_llm: true
    cost_class: high
    latency_class: high
    reliability: 0.85
    cache_scope: run
    tags: [intent:stock_check, intent:stock_compare]
  - subagent_type: screening_report_composer
    capability: finance.screen.report.compose
    implementation: subagents.runtime:compose_screening_report
    consumes:
      - artifact_type: screening_result
    produces:
      - artifact_type: research_report
    reliability: 0.9
    cache_scope: run
    tags: [intent:stock_screen]
  - subagent_type: sector_report_composer
    capability: finance.sector.report.compose
    implementation: subagents.runtime:compose_sector_report
    consumes:
      - artifact_type: sector_analysis
    produces:
      - artifact_type: research_report
    reliability: 0.9
    cache_scope: run
    tags: [intent:sector_research]
  - subagent_type: thesis_review_report_composer
    capability: finance.thesis.report.compose
    implementation: subagents.runtime:compose_thesis_review_report
    consumes:
      - artifact_type: thesis_review
    produces:
      - artifact_type: research_report
    reliability: 0.9
    cache_scope: run
    tags: [intent:review_thesis]
quality_gates:
  - gate_id: finance.sources_required
    artifact_type: research_report
    blocking: true
    description: Research reports require traceable evidence sources.
report_contracts:
  - contract_id: finance.research_report.v1
    artifact_type: research_report
    required_sections: [conclusion, evidence, risk, follow_up]
    required_source_refs: true
    required_gate_ids: [finance.sources_required]
planner_policies:
  task_intake: subagents.task_intake:resolve_request
  prefer_evidence_backed_paths: true
  supported_intents:
    - stock_check
    - stock_compare
    - stock_screen
    - sector_research
    - review_thesis
    - distill_kol_logic
  intent_outputs:
    stock_screen: [screening_result]
    sector_research: [sector_analysis]
    review_thesis: [thesis_review]
    distill_kol_logic: [distillation_result, distillation_review]
  intent_capabilities:
    distill_kol_logic:
      - finance.distillation.report.compose
evaluations:
  - evaluations/finance_research.yaml
governance:
  max_nodes: 128
  max_depth: 12
  max_concurrency: 16
  max_retries_per_node: 2
  required_gate_ids: []
  allowed_tools: [financial_data_provider]
metadata:
  dashboard_views:
    overview:
      resources:
        candidates:
          source: artifacts
          artifact_type: screening_result
          content_path: screened_candidates
          selection: latest_artifact
          limit: 4
        sector_heatmap:
          source: artifacts
          artifact_type: sector_analysis
          content_path: sector_heatmap
          selection: latest_per_item_key
          item_key: name
          limit: 7
    screening:
      resources:
        candidates:
          source: artifacts
          artifact_type: screening_result
          content_path: screened_candidates
          selection: latest_artifact
        watchlist_candidates:
          source: artifacts
          artifact_type: screening_result
          content_path: watchlist_candidates
          selection: latest_artifact
        scorecard:
          source: artifacts
          artifact_type: screening_result
          content_path: scorecard
          selection: latest_artifact
          limit: 1
        methodology:
          source: manifest
          value:
            name: A-share evidence-backed screening
            version: 1
            screen_styles:
              - id: value
                name: Value
                purpose: Prefer candidates with traceable valuation evidence.
              - id: growth
                name: Growth
                purpose: Require reported growth evidence before ranking growth claims.
              - id: quality
                name: Quality
                purpose: Prioritize profitability and cash-flow evidence coverage.
              - id: gulp
                name: GULP
                purpose: Cross-check growth, valuation, liquidity, and price evidence.
              - id: short
                name: Short risk review
                purpose: Surface downside and disclosure evidence gaps without simulating a trade.
    methodology:
      resources:
        profile:
          source: manifest
          value:
            name: A-share evidence-backed research
            version: 1
            description: Professional screening profiles are selected explicitly and never fill missing evidence with neutral scores.
            screen_styles:
              - id: value
                name: Value
                purpose: Prefer candidates with traceable valuation evidence.
              - id: growth
                name: Growth
                purpose: Require reported growth evidence before ranking growth claims.
              - id: quality
                name: Quality
                purpose: Prioritize profitability and cash-flow evidence coverage.
              - id: gulp
                name: GULP
                purpose: Cross-check growth, valuation, liquidity, and price evidence.
              - id: short
                name: Short risk review
                purpose: Surface downside and disclosure evidence gaps without simulating a trade.
            guardrails:
              - Hard data and source provenance are required for reusable conclusions.
              - Missing facts remain explicit data gaps and reduce confidence.
              - Conflicting valuation evidence is preserved for professional review.
              - High-impact methodology changes require evaluation and human approval before promotion.
        verified_policy_memory:
          source: memory
          layer: policy
          statuses: [verified, promoted]
          limit: 10
