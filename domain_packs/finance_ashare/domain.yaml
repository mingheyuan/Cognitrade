domain_id: finance_ashare
version: 0.1.0
description: A-share evidence-backed professional research pack.
artifact_types:
  - artifact_type: user_request
  - artifact_type: normalized_query
  - artifact_type: stock_snapshot_bundle
  - artifact_type: snapshot
  - artifact_type: evidence_set
  - artifact_type: financial_analysis
  - artifact_type: screening_result
  - artifact_type: sector_analysis
  - artifact_type: thesis_review
  - artifact_type: source_record_set
  - artifact_type: distillation_result
  - artifact_type: distillation_review
  - artifact_type: research_report
  - artifact_type: main_agent_synthesis
  - artifact_type: valuation_model
  - artifact_type: investor_panel_review
  - artifact_type: risk_scan
  - artifact_type: report_presentation
  - artifact_type: institutional_analysis
  - artifact_type: research_workflow
  - artifact_type: deep_analysis
  - artifact_type: uzi_dimension_coverage
skills:
  - skill_name: market_snapshot_skill
    version: "1"
    description: Collect A-share market snapshots with provider provenance.
    implementation: skills.market_snapshot.skill:MarketSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: fundamental_snapshot_skill
    version: "1"
    description: Collect A-share fundamental snapshots with provider provenance.
    implementation: skills.fundamental_snapshot.skill:FundamentalSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: notice_snapshot_skill
    version: "1"
    description: Collect A-share notice snapshots with provider provenance.
    implementation: skills.notice_snapshot.skill:NoticeSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: sector_snapshot_skill
    version: "1"
    description: Collect sector snapshots, constituents and catalyst evidence.
    implementation: skills.sector_snapshot.skill:SectorSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: lhb_snapshot_skill
    version: "1"
    description: Collect A-share Dragon-Tiger list snapshots.
    implementation: skills.lhb_snapshot.skill:LHBSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: capital_flow_snapshot_skill
    version: "1"
    description: Collect A-share capital-flow snapshots.
    implementation: skills.capital_flow_snapshot.skill:CapitalFlowSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: sentiment_snapshot_skill
    version: "1"
    description: Collect A-share sentiment snapshots.
    implementation: skills.sentiment_snapshot.skill:SentimentSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: events_snapshot_skill
    version: "1"
    description: Collect A-share event snapshots.
    implementation: skills.events_snapshot.skill:EventsSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: policy_snapshot_skill
    version: "1"
    description: Collect sector policy snapshots.
    implementation: skills.policy_snapshot.skill:PolicySnapshotSkill
    allowed_callers: [subagent]
  - skill_name: uzi_kline_snapshot_skill
    version: "1"
    description: Collect UZI price-history dimensions through the Finance Pack market provider.
    implementation: skills.uzi_source_snapshot.skill:KlineSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: uzi_macro_snapshot_skill
    version: "1"
    description: Collect benchmark and macro market context.
    implementation: skills.uzi_source_snapshot.skill:MacroSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: uzi_peers_snapshot_skill
    version: "1"
    description: Collect comparable-company evidence where the configured provider supports it.
    implementation: skills.uzi_source_snapshot.skill:PeersSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: uzi_chain_snapshot_skill
    version: "1"
    description: Collect industry-chain evidence with explicit provider gaps.
    implementation: skills.uzi_source_snapshot.skill:ChainSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: uzi_research_snapshot_skill
    version: "1"
    description: Collect source-backed research reports.
    implementation: skills.uzi_source_snapshot.skill:ResearchSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: uzi_industry_snapshot_skill
    version: "1"
    description: Resolve the company industry and related sector evidence.
    implementation: skills.uzi_source_snapshot.skill:IndustrySnapshotSkill
    allowed_callers: [subagent]
  - skill_name: uzi_materials_snapshot_skill
    version: "1"
    description: Collect materials and input-cost evidence when configured.
    implementation: skills.uzi_source_snapshot.skill:MaterialsSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: uzi_futures_snapshot_skill
    version: "1"
    description: Collect futures-linked evidence when configured.
    implementation: skills.uzi_source_snapshot.skill:FuturesSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: uzi_valuation_snapshot_skill
    version: "1"
    description: Collect valuation facts from the market provider.
    implementation: skills.uzi_source_snapshot.skill:ValuationSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: uzi_governance_snapshot_skill
    version: "1"
    description: Collect governance and disclosure facts.
    implementation: skills.uzi_source_snapshot.skill:GovernanceSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: uzi_moat_snapshot_skill
    version: "1"
    description: Collect moat evidence when a configured source is available.
    implementation: skills.uzi_source_snapshot.skill:MoatSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: uzi_trap_snapshot_skill
    version: "1"
    description: Collect trap and promotion-risk evidence with explicit gaps.
    implementation: skills.uzi_source_snapshot.skill:TrapSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: uzi_contests_snapshot_skill
    version: "1"
    description: Collect public portfolio and contest evidence when configured.
    implementation: skills.uzi_source_snapshot.skill:ContestsSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: uzi_fund_holders_snapshot_skill
    version: "1"
    description: Collect reported fund-holder evidence for a symbol.
    implementation: skills.uzi_source_snapshot.skill:FundHoldersSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: uzi_similar_stocks_snapshot_skill
    version: "1"
    description: Collect industry-based similar-stock evidence.
    implementation: skills.uzi_source_snapshot.skill:SimilarStocksSnapshotSkill
    allowed_callers: [subagent]
intake:
  implementation: subagents.task_intake:resolve_request
  minimum_confidence: 0.65
  intents:
    - intent_id: stock_check
      description: Analyze one or more A-share companies with evidence-backed financial context.
      required_slots: [symbols]
      candidate_capabilities:
        - finance.query.normalize
        - finance.ashare.snapshot.collect
        - evidence.select
        - finance.uzi.report.compose
      output_artifact_types: [research_report]
    - intent_id: stock_compare
      description: Compare two or more A-share companies on a consistent evidence basis.
      required_slots: [symbols]
      candidate_capabilities:
        - finance.query.normalize
        - finance.ashare.snapshot.collect
        - evidence.select
        - finance.uzi.report.compose
      output_artifact_types: [research_report]
    - intent_id: stock_screen
      description: Screen an A-share universe and produce traceable candidates.
      required_slots: []
      optional_slots: [symbols, sector]
      candidate_capabilities:
        - finance.query.normalize
        - finance.ashare.snapshot.collect
        - finance.stock.screen
        - finance.screen.report.compose
      output_artifact_types: [research_report]
    - intent_id: sector_research
      description: Research a sector or industry using current evidence.
      required_slots: [sector]
      candidate_capabilities:
        - finance.query.normalize
        - finance.ashare.snapshot.collect
        - finance.sector.research
        - finance.sector.report.compose
      output_artifact_types: [research_report]
    - intent_id: review_thesis
      description: Review a prior research thesis and identify support, gaps, and risks.
      required_slots: [review_target_run_id]
      candidate_capabilities:
        - finance.query.normalize
        - evidence.select
        - finance.thesis.review
        - finance.thesis.report.compose
      output_artifact_types: [research_report]
    - intent_id: distill_kol_logic
      description: Distill a research methodology from source records and review it.
      required_slots: [source_records]
      candidate_capabilities:
        - finance.query.normalize
        - finance.distillation.sources.collect
        - finance.kol.logic.distill
        - finance.distillation.review
        - finance.distillation.report.compose
      output_artifact_types: [distillation_result, distillation_review]
capabilities:
  - subagent_type: query_normalizer
    capability: finance.query.normalize
    implementation: subagents.runtime:normalize_query
    consumes:
      - artifact_type: user_request
    produces:
      - artifact_type: normalized_query
    cost_class: low
    latency_class: low
    reliability: 0.99
    cache_scope: global
  - subagent_type: stock_snapshot_collector
    capability: finance.ashare.snapshot.collect
    implementation: subagents.runtime:collect_snapshot
    consumes:
      - artifact_type: normalized_query
    produces:
      - artifact_type: snapshot
        required: false
        multiple: true
      - artifact_type: stock_snapshot_bundle
    tools:
      - financial_data_provider
    permissions:
      - finance:data:read
    side_effect_level: read_only
    parallel_safe: true
    max_concurrency: 8
    cost_class: medium
    latency_class: medium
    reliability: 0.9
    cache_scope: run
  - subagent_type: retrieval_decider
    capability: evidence.select
    implementation: subagents.runtime:select_evidence
    consumes:
      - &finance_snapshot_input
        artifact_type: snapshot
        required: true
        multiple: true
        selector:
           dimensions: [market, fundamental, notice, capital_flow, sentiment, events, lhb, kline, macro, peers, chain, research, industry, materials, futures, valuation, governance, moat, trap, contests, sector, policy]
    produces:
      - artifact_type: evidence_set
    requires_llm: true
    cost_class: medium
    latency_class: medium
    reliability: 0.85
    cache_scope: run
  - subagent_type: financial_analyst
    capability: finance.analysis.evaluate
    implementation: subagents.runtime:analyze_financials
    consumes:
      - *finance_snapshot_input
    produces:
      - artifact_type: financial_analysis
    reliability: 0.92
    cache_scope: run
  - subagent_type: uzi_valuation_analyst
    capability: finance.uzi.valuation.evaluate
    capability_version: "1"
    methodology_version: "3.9.1-adapted"
    implementation: subagents.runtime:evaluate_uzi_valuation
    consumes:
      - *finance_snapshot_input
    produces:
      - artifact_type: valuation_model
    cost_class: low
    latency_class: low
    reliability: 0.9
    parallel_safe: true
    cache_scope: run
    freshness_ttl_seconds: 86400
    data_period_policy: {kind: latest_available_financial_period}
    tags: [profile:quick, profile:lite, profile:medium, profile:deep]
  - subagent_type: uzi_panel_reviewer
    capability: finance.uzi.panel.review
    capability_version: "1"
    methodology_version: "3.9.1-adapted"
    implementation: subagents.runtime:evaluate_uzi_panel
    consumes:
      - *finance_snapshot_input
    produces:
      - artifact_type: investor_panel_review
    cost_class: medium
    latency_class: low
    reliability: 0.86
    parallel_safe: true
    cache_scope: global
    freshness_ttl_seconds: 86400
    tags: [profile:quick, profile:lite, profile:medium, profile:deep]
  - subagent_type: uzi_risk_scanner
    capability: finance.uzi.risk.scan
    capability_version: "1"
    methodology_version: "3.9.1-adapted"
    implementation: subagents.runtime:evaluate_uzi_risk
    consumes:
      - *finance_snapshot_input
    produces:
      - artifact_type: risk_scan
    cost_class: low
    latency_class: low
    reliability: 0.82
    parallel_safe: true
    cache_scope: global
    freshness_ttl_seconds: 3600
    tags: [profile:quick, profile:lite, profile:medium, profile:deep]
  - subagent_type: uzi_institutional_analyst
    capability: finance.uzi.institutional.evaluate
    capability_version: "1"
    methodology_version: "3.9.1-adapted"
    implementation: subagents.runtime:evaluate_uzi_institutional
    consumes:
      - *finance_snapshot_input
      - artifact_type: valuation_model
        required: false
    produces:
      - artifact_type: institutional_analysis
    cost_class: medium
    latency_class: medium
    reliability: 0.82
    parallel_safe: true
    cache_scope: global
    freshness_ttl_seconds: 86400
    tags: [profile:medium, profile:deep]
  - subagent_type: uzi_workflow_analyst
    capability: finance.uzi.workflow.evaluate
    capability_version: "1"
    methodology_version: "3.9.1-adapted"
    implementation: subagents.runtime:evaluate_uzi_workflow
    consumes:
      - *finance_snapshot_input
      - artifact_type: valuation_model
        required: false
    produces:
      - artifact_type: research_workflow
    cost_class: medium
    latency_class: medium
    reliability: 0.82
    parallel_safe: true
    cache_scope: global
    freshness_ttl_seconds: 86400
    tags: [profile:medium, profile:deep]
  - subagent_type: uzi_deep_analyst
    capability: finance.uzi.deep.evaluate
    capability_version: "1"
    methodology_version: "3.9.1-adapted"
    implementation: subagents.runtime:evaluate_uzi_deep
    consumes:
      - *finance_snapshot_input
      - artifact_type: institutional_analysis
      - artifact_type: research_workflow
    produces:
      - artifact_type: deep_analysis
    cost_class: high
    latency_class: high
    reliability: 0.78
    parallel_safe: true
    cache_scope: global
    freshness_ttl_seconds: 43200
    tags: [profile:deep]
  - subagent_type: uzi_dimension_coverage_analyzer
    capability: finance.uzi.dimensions.cover
    capability_version: "1"
    methodology_version: "3.9.1-adapted"
    implementation: subagents.runtime:evaluate_uzi_dimension_coverage
    consumes:
      - *finance_snapshot_input
      - artifact_type: institutional_analysis
        required: false
      - artifact_type: research_workflow
        required: false
      - artifact_type: deep_analysis
        required: false
    produces:
      - artifact_type: uzi_dimension_coverage
    cost_class: low
    latency_class: low
    reliability: 0.98
    parallel_safe: true
    cache_scope: global
    freshness_ttl_seconds: 3600
    tags: [profile:medium, profile:deep]
  - subagent_type: stock_screen_analyzer
    capability: finance.stock.screen
    implementation: subagents.runtime:screen_stocks
    consumes:
      - *finance_snapshot_input
    produces:
      - artifact_type: screening_result
    parallel_safe: true
    reliability: 0.9
    cache_scope: run
    tags: [intent:stock_screen]
  - subagent_type: sector_research_analyzer
    capability: finance.sector.research
    implementation: subagents.runtime:research_sector
    consumes:
      - *finance_snapshot_input
    produces:
      - artifact_type: sector_analysis
    parallel_safe: true
    reliability: 0.9
    cache_scope: run
    tags: [intent:sector_research]
  - subagent_type: thesis_reviewer
    capability: finance.thesis.review
    implementation: subagents.runtime:review_thesis
    consumes:
      - artifact_type: evidence_set
    produces:
      - artifact_type: thesis_review
    reliability: 0.9
    cache_scope: run
    tags: [intent:review_thesis]
  - subagent_type: distillation_source_collector
    capability: finance.distillation.sources.collect
    implementation: subagents.runtime:collect_distillation_sources
    consumes:
      - artifact_type: normalized_query
    produces:
      - artifact_type: source_record_set
    reliability: 0.98
    cache_scope: run
    tags: [intent:distill_kol_logic]
  - subagent_type: kol_logic_distiller
    capability: finance.kol.logic.distill
    implementation: subagents.runtime:distill_kol_logic
    consumes:
      - artifact_type: source_record_set
    produces:
      - artifact_type: distillation_result
    parallel_safe: true
    reliability: 0.9
    cache_scope: run
    tags: [intent:distill_kol_logic]
  - subagent_type: distillation_reviewer
    capability: finance.distillation.review
    implementation: subagents.runtime:review_distillation
    consumes:
      - artifact_type: distillation_result
    produces:
      - artifact_type: distillation_review
    reliability: 0.92
    cache_scope: run
    tags: [intent:distill_kol_logic]
  - subagent_type: distillation_report_composer
    capability: finance.distillation.report.compose
    implementation: subagents.runtime:compose_distillation_report
    consumes:
      - artifact_type: distillation_review
    produces:
      - artifact_type: research_report
    reliability: 0.9
    cache_scope: run
    tags: [intent:distill_kol_logic]
  - subagent_type: uzi_report_composer
    capability: finance.uzi.report.compose
    capability_version: "1"
    methodology_version: "3.9.1-adapted"
    implementation: subagents.runtime:compose_uzi_report
    consumes:
      - artifact_type: evidence_set
      - artifact_type: valuation_model
      - artifact_type: investor_panel_review
        required: false
      - artifact_type: risk_scan
        required: false
      - artifact_type: institutional_analysis
        required: false
      - artifact_type: research_workflow
        required: false
      - artifact_type: deep_analysis
        required: false
    produces:
      - artifact_type: research_report
      - artifact_type: report_presentation
    cost_class: low
    latency_class: low
    reliability: 0.9
    cache_scope: run
    freshness_ttl_seconds: 0
    tags: [profile:quick, profile:lite, profile:medium, profile:deep]
  - subagent_type: research_safety_gate_evaluator
    capability: finance.report.safety.gate
    implementation: subagents.runtime:evaluate_research_safety_gate
    cost_class: low
    latency_class: low
    reliability: 0.99
    cache_scope: run
  - subagent_type: methodology_quality_gate_evaluator
    capability: finance.methodology.quality.gate
    implementation: subagents.runtime:evaluate_methodology_quality_gate
    cost_class: low
    latency_class: low
    reliability: 0.99
    cache_scope: run
  - subagent_type: screening_report_composer
    capability: finance.screen.report.compose
    implementation: subagents.runtime:compose_screening_report
    consumes:
      - artifact_type: screening_result
    produces:
      - artifact_type: research_report
    reliability: 0.9
    cache_scope: run
    tags: [intent:stock_screen]
  - subagent_type: sector_report_composer
    capability: finance.sector.report.compose
    implementation: subagents.runtime:compose_sector_report
    consumes:
      - artifact_type: sector_analysis
    produces:
      - artifact_type: research_report
    reliability: 0.9
    cache_scope: run
    tags: [intent:sector_research]
  - subagent_type: thesis_review_report_composer
    capability: finance.thesis.report.compose
    implementation: subagents.runtime:compose_thesis_review_report
    consumes:
      - artifact_type: thesis_review
    produces:
      - artifact_type: research_report
    reliability: 0.9
    cache_scope: run
    tags: [intent:review_thesis]
quality_gates:
  - gate_id: finance.sources_required
    artifact_type: research_report
    blocking: true
    description: Research reports require traceable evidence sources.
  - gate_id: finance.research_safety
    artifact_type: research_report
    evaluator_capability: finance.report.safety.gate
    blocking: true
    description: Research reports must pass source and professional risk checks.
  - gate_id: finance.valuation.input
    artifact_type: valuation_model
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Valuation outputs must expose input quality and assumption status.
    config:
      allowed_quality_statuses: [available, degraded, assumption_only, data_gap]
  - gate_id: finance.methodology.input
    artifact_type: institutional_analysis
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Institutional method outputs must expose input quality and assumptions.
    config:
      allowed_quality_statuses: [available, degraded, assumption_only, data_gap]
  - gate_id: finance.financial.input
    artifact_type: financial_analysis
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Reusable financial methods must expose input quality and assumptions.
    config:
      allowed_quality_statuses: [available, degraded, assumption_only, data_gap]
  - gate_id: finance.workflow.input
    artifact_type: research_workflow
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Research workflow outputs must expose source coverage and gaps.
    config:
      allowed_quality_statuses: [available, degraded, assumption_only, data_gap]
  - gate_id: finance.deep.input
    artifact_type: deep_analysis
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Deep analysis outputs must expose method and evidence limitations.
    config:
      allowed_quality_statuses: [available, degraded, assumption_only, data_gap]
  - gate_id: finance.dimension.coverage
    artifact_type: uzi_dimension_coverage
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Dimension coverage must separate source dimensions from derived products.
    config:
      allowed_quality_statuses: [available, degraded, data_gap]
  - gate_id: finance.panel.lineage
    artifact_type: investor_panel_review
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Panel outputs must preserve methodology lineage and evidence status.
    config:
      allowed_quality_statuses: [available, degraded, data_gap]
  - gate_id: finance.risk.evidence
    artifact_type: risk_scan
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Risk outputs must distinguish observed signals from data gaps.
    config:
      allowed_quality_statuses: [available, degraded, data_gap]
  - gate_id: finance.screening.quality
    artifact_type: screening_result
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Screening outputs must preserve candidate evidence, ranking inputs and data gaps.
    config:
      allowed_quality_statuses: [available, degraded, data_gap]
  - gate_id: finance.sector.analysis
    artifact_type: sector_analysis
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Sector analysis must preserve constituent, heatmap and catalyst provenance.
    config:
      allowed_quality_statuses: [available, degraded, data_gap]
  - gate_id: finance.thesis.review
    artifact_type: thesis_review
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Thesis review must preserve claim-level evidence, counterevidence and gaps.
    config:
      allowed_quality_statuses: [available, degraded, data_gap]
  - gate_id: finance.presentation.lineage
    artifact_type: report_presentation
    evaluator_capability: finance.methodology.quality.gate
    blocking: true
    description: Presentation must reference the same active semantic artifacts.
    config:
      allowed_quality_statuses: [available, degraded, assumption_only, data_gap]
report_contracts:
  - contract_id: finance.research_report.v1
    artifact_type: research_report
    required_sections: [conclusion, evidence, risk, follow_up]
    required_source_refs: true
    required_gate_ids: [finance.sources_required, finance.research_safety]
  - contract_id: finance.report_presentation.v1
    artifact_type: report_presentation
    required_sections: [theme, profile, hero, core_conclusion, source_artifact_ids, data_gap]
    required_source_refs: true
    required_gate_ids: [finance.presentation.lineage]
planner_policies:
  prefer_evidence_backed_paths: true
  default_profile: lite
  profile_intents: [stock_check, stock_compare, stock_screen, sector_research, review_thesis]
  profile_output_intents: [stock_check, stock_compare]
  intent_profiles:
    stock_screen: quick
    sector_research: lite
    review_thesis: quick
  progress_policy:
    max_model_updates: 12
    max_tokens: 1200
    min_interval_seconds: 1.0
    timeout_seconds: 8.0
    fallback: structured
  snapshot_dimensions:
    - market
    - fundamental
    - notice
    - lhb
    - capital_flow
    - sentiment
    - events
    - kline
    - macro
    - peers
    - chain
    - research
    - industry
    - materials
    - futures
    - valuation
    - governance
    - moat
    - trap
    - contests
  research_profiles:
    quick:
      max_cost_class: medium
      max_latency_class: medium
      max_duration_seconds: 90
      allowed_capability_tags: [profile:quick]
      methods: [dcf, risk]
    lite:
      max_cost_class: medium
      max_latency_class: medium
      max_duration_seconds: 300
      allowed_capability_tags: [profile:quick, profile:lite]
