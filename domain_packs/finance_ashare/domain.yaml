domain_id: finance_ashare
version: 0.7.0
description: A-share evidence-backed professional research pack.
artifact_types:
  - artifact_type: user_request
  - artifact_type: normalized_query
  - artifact_type: stock_snapshot_bundle
  - artifact_type: snapshot
  - artifact_type: evidence_set
  - artifact_type: screening_result
  - artifact_type: sector_analysis
  - artifact_type: thesis_review
  - artifact_type: source_record_set
  - artifact_type: distillation_result
  - artifact_type: distillation_review
  - artifact_type: research_report
  - artifact_type: main_agent_synthesis
  - artifact_type: quick_scan
  - artifact_type: uzi_native_method_result
  - artifact_type: uzi_native_command_result
  - artifact_type: uzi_native_analysis
  - artifact_type: fund_snapshot
  - artifact_type: fund_analysis
  - artifact_type: fund_holding_report_batch
skills:
  - skill_name: market_snapshot_skill
    version: "1"
    description: Collect A-share market snapshots with provider provenance.
    implementation: skills.market_snapshot.skill:MarketSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: fundamental_snapshot_skill
    version: "1"
    description: Collect A-share fundamental snapshots with provider provenance.
    implementation: skills.fundamental_snapshot.skill:FundamentalSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: fund_snapshot_skill
    version: "1"
    description: Collect public-fund identity, ranking, NAV risk and disclosed holdings from real providers.
    implementation: skills.fund_snapshot.skill:FundSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: notice_snapshot_skill
    version: "1"
    description: Collect A-share notice snapshots with provider provenance.
    implementation: skills.notice_snapshot.skill:NoticeSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: sector_snapshot_skill
    version: "1"
    description: Collect sector snapshots, constituents and catalyst evidence.
    implementation: skills.sector_snapshot.skill:SectorSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: lhb_snapshot_skill
    version: "1"
    description: Collect A-share Dragon-Tiger list snapshots.
    implementation: skills.lhb_snapshot.skill:LHBSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: capital_flow_snapshot_skill
    version: "1"
    description: Collect A-share capital-flow snapshots.
    implementation: skills.capital_flow_snapshot.skill:CapitalFlowSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: sentiment_snapshot_skill
    version: "1"
    description: Collect A-share sentiment snapshots.
    implementation: skills.sentiment_snapshot.skill:SentimentSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: events_snapshot_skill
    version: "1"
    description: Collect A-share event snapshots.
    implementation: skills.events_snapshot.skill:EventsSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: policy_snapshot_skill
    version: "1"
    description: Collect sector policy snapshots.
    implementation: skills.policy_snapshot.skill:PolicySnapshotSkill
    allowed_callers: [subagent]
  - skill_name: uzi_kline_snapshot_skill
    version: "1"
    description: Collect UZI price-history dimensions through the Finance Pack market provider.
    implementation: skills.uzi_source_snapshot.skill:KlineSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: uzi_macro_snapshot_skill
    version: "1"
    description: Collect benchmark and macro market context.
    implementation: skills.uzi_source_snapshot.skill:MacroSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: uzi_peers_snapshot_skill
    version: "1"
    description: Collect comparable-company evidence where the configured provider supports it.
    implementation: skills.uzi_source_snapshot.skill:PeersSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: uzi_chain_snapshot_skill
    version: "1"
    description: Collect industry-chain evidence with explicit provider gaps.
    implementation: skills.uzi_source_snapshot.skill:ChainSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: uzi_research_snapshot_skill
    version: "1"
    description: Collect source-backed research reports.
    implementation: skills.uzi_source_snapshot.skill:ResearchSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: uzi_industry_snapshot_skill
    version: "1"
    description: Resolve the company industry and related sector evidence.
    implementation: skills.uzi_source_snapshot.skill:IndustrySnapshotSkill
    allowed_callers: [subagent]
  - skill_name: uzi_materials_snapshot_skill
    version: "1"
    description: Collect materials and input-cost evidence when configured.
    implementation: skills.uzi_source_snapshot.skill:MaterialsSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: uzi_futures_snapshot_skill
    version: "1"
    description: Collect futures-linked evidence when configured.
    implementation: skills.uzi_source_snapshot.skill:FuturesSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: uzi_valuation_snapshot_skill
    version: "1"
    description: Collect valuation facts from the market provider.
    implementation: skills.uzi_source_snapshot.skill:ValuationSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: uzi_governance_snapshot_skill
    version: "1"
    description: Collect governance and disclosure facts.
    implementation: skills.uzi_source_snapshot.skill:GovernanceSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: uzi_moat_snapshot_skill
    version: "1"
    description: Collect moat evidence when a configured source is available.
    implementation: skills.uzi_source_snapshot.skill:MoatSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: uzi_trap_snapshot_skill
    version: "1"
    description: Collect trap and promotion-risk evidence with explicit gaps.
    implementation: skills.uzi_source_snapshot.skill:TrapSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: uzi_contests_snapshot_skill
    version: "1"
    description: Collect public portfolio and contest evidence when configured.
    implementation: skills.uzi_source_snapshot.skill:ContestsSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: uzi_fund_holders_snapshot_skill
    version: "1"
    description: Collect reported fund-holder evidence for a symbol.
    implementation: skills.uzi_source_snapshot.skill:FundHoldersSnapshotSkill
    allowed_callers: [subagent]
  - skill_name: uzi_similar_stocks_snapshot_skill
    version: "1"
    description: Collect industry-based similar-stock evidence.
    implementation: skills.uzi_source_snapshot.skill:SimilarStocksSnapshotSkill
    allowed_callers: [subagent]
intake:
  implementation: subagents.task_intake:resolve_request
  minimum_confidence: 0.65
  intents:
    - intent_id: stock_check
      description: Run the complete pinned UZI 3.9.4 analysis and strict quality gate on one company.
      required_slots: [symbols, research_profile]
      optional_slots: [school]
      candidate_capabilities:
        - finance.query.normalize
        - finance.ashare.snapshot.collect
        - finance.uzi.native.analyze_stock
        - finance.uzi.native.report.compose
      output_artifact_types: [research_report]
    - intent_id: uzi_analyze_stock
      description: Run the pinned UZI /analyze-stock command as an independent Agent OS capability.
      required_slots: [symbols, research_profile]
      optional_slots: [school]
      candidate_capabilities:
        - finance.query.normalize
        - finance.ashare.snapshot.collect
        - finance.uzi.native.analyze_stock
        - finance.uzi.native.report.compose
      output_artifact_types: [research_report]
    - intent_id: quick_scan
      description: Run the pinned UZI 3.9.4 four-dimension stock quick scan and return concise Markdown.
      required_slots: [symbols]
      candidate_capabilities:
        - finance.query.normalize
        - finance.ashare.snapshot.collect
        - finance.uzi.quick_scan.compose
      output_artifact_types: [quick_scan]
    - intent_id: uzi_dcf
      description: Run the pinned UZI /dcf command as an independent Agent OS capability.
      required_slots: [symbols]
      candidate_capabilities: [finance.query.normalize, finance.ashare.snapshot.collect, finance.uzi.native.dcf]
      output_artifact_types: [uzi_native_method_result]
    - intent_id: uzi_panel_only
      description: Run the pinned UZI /panel-only rule-engine panel without the full report pipeline.
      required_slots: [symbols]
      candidate_capabilities: [finance.query.normalize, finance.ashare.snapshot.collect, finance.uzi.command.panel_only]
      output_artifact_types: [uzi_native_command_result]
    - intent_id: uzi_scan_trap
      description: Run the pinned UZI /scan-trap eight-signal command with explicit evidence coverage.
      required_slots: [symbols]
      candidate_capabilities: [finance.query.normalize, finance.ashare.snapshot.collect, finance.uzi.command.scan_trap]
      output_artifact_types: [uzi_native_command_result]
    - intent_id: uzi_segmental_model
      description: Run the pinned UZI /segmental-model discovery and validation phases.
      required_slots: [symbols]
      optional_slots: [segmental_model]
      candidate_capabilities: [finance.query.normalize, finance.ashare.snapshot.collect, finance.uzi.command.segmental_model]
      output_artifact_types: [uzi_native_command_result]
    - intent_id: uzi_comps
      description: Run the pinned UZI /comps command as an independent Agent OS capability.
      required_slots: [symbols]
      candidate_capabilities: [finance.query.normalize, finance.ashare.snapshot.collect, finance.uzi.native.comps]
      output_artifact_types: [uzi_native_method_result]
    - intent_id: uzi_lbo
      description: Run the pinned UZI /lbo command, preserving its optional transaction defaults when assumptions are omitted.
      required_slots: [symbols]
      candidate_capabilities: [finance.query.normalize, finance.ashare.snapshot.collect, finance.uzi.native.quick_lbo]
      output_artifact_types: [uzi_native_method_result]
    - intent_id: uzi_initiate
      description: Run the pinned UZI /initiate command as an independent Agent OS capability.
      required_slots: [symbols]
      candidate_capabilities: [finance.query.normalize, finance.ashare.snapshot.collect, finance.uzi.native.initiation_report]
      output_artifact_types: [uzi_native_method_result]
    - intent_id: uzi_earnings
      description: Run the pinned UZI /earnings command as an independent Agent OS capability.
      required_slots: [symbols]
      candidate_capabilities: [finance.query.normalize, finance.ashare.snapshot.collect, finance.uzi.native.earnings_review]
      output_artifact_types: [uzi_native_method_result]
    - intent_id: uzi_catalysts
      description: Run the pinned UZI /catalysts command as an independent Agent OS capability.
      required_slots: [symbols]
      candidate_capabilities: [finance.query.normalize, finance.ashare.snapshot.collect, finance.uzi.native.catalyst_calendar]
      output_artifact_types: [uzi_native_method_result]
    - intent_id: uzi_thesis
      description: Run the pinned UZI /thesis command as an independent Agent OS capability.
      required_slots: [symbols]
      candidate_capabilities: [finance.query.normalize, finance.ashare.snapshot.collect, finance.uzi.native.thesis_tracker]
      output_artifact_types: [uzi_native_method_result]
    - intent_id: uzi_screen
      description: Run the pinned UZI /screen command as an independent Agent OS capability.
      required_slots: [symbols]
      candidate_capabilities: [finance.query.normalize, finance.ashare.snapshot.collect, finance.uzi.native.quantitative_screen]
      output_artifact_types: [uzi_native_method_result]
    - intent_id: uzi_dd
      description: Run the pinned UZI /dd command as an independent Agent OS capability.
      required_slots: [symbols]
      candidate_capabilities: [finance.query.normalize, finance.ashare.snapshot.collect, finance.uzi.native.dd_checklist]
      output_artifact_types: [uzi_native_method_result]
    - intent_id: uzi_ic_memo
      description: Run the pinned UZI /ic-memo command as an independent Agent OS capability.
      required_slots: [symbols]
      candidate_capabilities: [finance.query.normalize, finance.ashare.snapshot.collect, finance.uzi.native.ic_memo]
      output_artifact_types: [uzi_native_method_result]
    - intent_id: uzi_ai_readiness
      description: Run the pinned UZI /ai-readiness command as an independent Agent OS capability.
      required_slots: [symbols]
      candidate_capabilities: [finance.query.normalize, finance.ashare.snapshot.collect, finance.uzi.native.ai_readiness]
      output_artifact_types: [uzi_native_method_result]
    - intent_id: uzi_earnings_preview
      description: Run the pinned UZI /earnings-preview command as an independent Agent OS capability.
      required_slots: [symbols]
      candidate_capabilities: [finance.query.normalize, finance.ashare.snapshot.collect, finance.uzi.native.earnings_preview]
      output_artifact_types: [uzi_native_method_result]
    - intent_id: uzi_model_update
      description: Run the pinned UZI /model-update command, including its native demo mode when updates are omitted.
      required_slots: [symbols]
      candidate_capabilities: [finance.query.normalize, finance.ashare.snapshot.collect, finance.uzi.native.model_update]
      output_artifact_types: [uzi_native_method_result]
    - intent_id: uzi_three_statement_method
      description: Run the pinned UZI three-statement method, preserving native defaults for omitted forecast assumptions.
      required_slots: [symbols]
      candidate_capabilities: [finance.query.normalize, finance.ashare.snapshot.collect, finance.uzi.native.three_statement]
      output_artifact_types: [uzi_native_method_result]
    - intent_id: uzi_accretion_dilution_method
      description: Run the pinned UZI merger accretion/dilution method with an explicit target and optional native deal-term defaults.
      required_slots: [symbols, method_assumptions]
      candidate_capabilities: [finance.query.normalize, finance.ashare.snapshot.collect, finance.uzi.native.accretion_dilution]
      output_artifact_types: [uzi_native_method_result]
    - intent_id: uzi_morning_note_method
      description: Run the pinned UZI morning-note method.
      required_slots: [symbols]
      candidate_capabilities: [finance.query.normalize, finance.ashare.snapshot.collect, finance.uzi.native.morning_note]
      output_artifact_types: [uzi_native_method_result]
    - intent_id: uzi_sector_review_method
      description: Run the pinned UZI sector-review method.
      required_slots: [symbols]
      candidate_capabilities: [finance.query.normalize, finance.ashare.snapshot.collect, finance.uzi.native.sector_review]
      output_artifact_types: [uzi_native_method_result]
    - intent_id: uzi_porter_bcg_method
      description: Run the pinned UZI Porter/BCG decision method.
      required_slots: [symbols]
      candidate_capabilities: [finance.query.normalize, finance.ashare.snapshot.collect, finance.uzi.native.porter_bcg]
      output_artifact_types: [uzi_native_method_result]
    - intent_id: uzi_unit_economics_method
      description: Run the pinned UZI unit-economics method and disclose its native proxy assumptions as degraded evidence.
      required_slots: [symbols]
      candidate_capabilities: [finance.query.normalize, finance.ashare.snapshot.collect, finance.uzi.native.unit_economics]
      output_artifact_types: [uzi_native_method_result]
    - intent_id: uzi_value_creation_plan_method
      description: Run the pinned UZI value-creation-plan method and disclose its native proxy assumptions as degraded evidence.
      required_slots: [symbols]
      candidate_capabilities: [finance.query.normalize, finance.ashare.snapshot.collect, finance.uzi.native.value_creation_plan]
      output_artifact_types: [uzi_native_method_result]
    - intent_id: uzi_portfolio_rebalance_method
      description: Run the pinned UZI strategic portfolio-rebalance method, using its native balanced allocation when targets are omitted.
      required_slots: [portfolio_holdings]
      candidate_capabilities: [finance.query.normalize, finance.uzi.native.portfolio_rebalance]
      output_artifact_types: [uzi_native_method_result]
    - intent_id: uzi_returns
      description: Run the pinned UZI /returns command, preserving its missing-return warning and zero-contribution behavior.
      required_slots: [portfolio_holdings]
      candidate_capabilities: [finance.query.normalize, finance.uzi.native.returns_attribution]
      output_artifact_types: [uzi_native_method_result]
    - intent_id: uzi_rebalance
      description: Run the pinned UZI /rebalance command with native equal-weight targets and fee schedule when omitted.
      required_slots: [portfolio_holdings]
      candidate_capabilities: [finance.query.normalize, finance.uzi.native.holding_rebalance]
      output_artifact_types: [uzi_native_method_result]
    - intent_id: stock_compare
      description: Run the pinned UZI --versus flow for two to four A-share companies on a consistent evidence basis.
      required_slots: [symbols, research_profile]
      optional_slots: [school]
      candidate_capabilities:
        - finance.query.normalize
        - finance.ashare.snapshot.collect
        - finance.uzi.native.analyze_stock
        - finance.stock.compare.report.compose
      output_artifact_types: [research_report]
    - intent_id: uzi_portfolio_batch
      description: Run the pinned UZI --portfolio flow over explicit holdings, with native weight normalization and portfolio HTML.
      required_slots: [portfolio_holdings, research_profile]
      optional_slots: [portfolio_name, school]
      candidate_capabilities:
        - finance.query.normalize
        - finance.ashare.snapshot.collect
        - finance.uzi.native.analyze_stock
        - finance.uzi.portfolio.report.compose
      output_artifact_types: [research_report]
    - intent_id: stock_screen
      description: Screen an A-share universe and produce traceable candidates.
      required_slots: [research_profile, investment_cycle]
      optional_slots: [symbols, sector]
      candidate_capabilities:
        - finance.query.normalize
        - finance.ashare.snapshot.collect
        - finance.stock.screen
        - finance.screen.report.compose
      output_artifact_types: [research_report]
    - intent_id: fund_research
      description: Compare or assess Chinese public funds using real NAV, return, fee and disclosed-holdings evidence.
      required_slots: [investment_cycle]
      optional_slots: [fund_codes, fund_category]
      candidate_capabilities:
        - finance.query.normalize
        - finance.fund.snapshot.collect
        - finance.fund.analyze
        - finance.fund.report.compose
      output_artifact_types: [fund_analysis, research_report]
    - intent_id: sector_research
      description: Research a sector or industry using current evidence.
      required_slots: [sector, research_profile]
      candidate_capabilities:
        - finance.query.normalize
        - finance.ashare.snapshot.collect
        - finance.sector.research
        - finance.sector.report.compose
      output_artifact_types: [research_report]
    - intent_id: review_thesis
      description: Review a prior research thesis and identify support, gaps, and risks.
      required_slots: [review_target_run_id, research_profile]
      candidate_capabilities:
        - finance.query.normalize
        - evidence.select
        - finance.thesis.review
        - finance.thesis.report.compose
      output_artifact_types: [research_report]
    - intent_id: distill_kol_logic
      description: Distill a research methodology from source records and review it.
      required_slots: [source_records]
      candidate_capabilities:
        - finance.query.normalize
        - finance.distillation.sources.collect
        - finance.kol.logic.distill
        - finance.distillation.review
        - finance.distillation.report.compose
      output_artifact_types: [distillation_result, distillation_review]
capabilities:
  - subagent_type: query_normalizer
    capability: finance.query.normalize
    implementation: subagents.runtime:normalize_query
    consumes:
      - artifact_type: user_request
    produces:
      - artifact_type: normalized_query
    cost_class: low
    latency_class: low
    reliability: 0.99
    cache_scope: global
  - subagent_type: stock_snapshot_collector
    capability: finance.ashare.snapshot.collect
    implementation: subagents.runtime:collect_snapshot
    consumes:
      - artifact_type: normalized_query
    produces:
      - artifact_type: snapshot
        required: false
        multiple: true
      - artifact_type: stock_snapshot_bundle
    tools:
      - financial_data_provider
    permissions:
      - finance:data:read
    side_effect_level: read_only
    parallel_safe: true
    max_concurrency: 8
    cost_class: medium
    latency_class: medium
    reliability: 0.9
    cache_scope: run
  - subagent_type: fund_snapshot_collector
    capability: finance.fund.snapshot.collect
    capability_version: "1"
    implementation: subagents.runtime:collect_fund_snapshot
    consumes:
      - artifact_type: normalized_query
    produces:
      - artifact_type: fund_snapshot
    tools:
      - fund_data_provider
    permissions:
      - finance:data:read
    side_effect_level: read_only
    parallel_safe: false
    cost_class: medium
    latency_class: medium
    reliability: 0.84
    cache_scope: run
    freshness_ttl_seconds: 43200
    tags: [intent:fund_research]
  - subagent_type: fund_research_analyst
    capability: finance.fund.analyze
    capability_version: "1"
    methodology_version: "uzi-3.9.4-fund-selection-v4"
    implementation: subagents.runtime:analyze_funds
    consumes:
      - artifact_type: fund_snapshot
    produces:
      - artifact_type: fund_analysis
    parallel_safe: true
    cost_class: low
    latency_class: low
    reliability: 0.92
    cache_scope: run
    tags: [intent:fund_research]
  - subagent_type: fund_report_composer
    capability: finance.fund.report.compose
    capability_version: "1"
    methodology_version: "uzi-3.9.4-fund-selection-v4"
    implementation: subagents.runtime:compose_fund_report
    consumes:
      - artifact_type: fund_analysis
    produces:
      - artifact_type: research_report
    cost_class: low
    latency_class: low
    reliability: 0.95
    cache_scope: run
    tags: [intent:fund_research]
  - subagent_type: retrieval_decider
    capability: evidence.select
    implementation: subagents.runtime:select_evidence
    consumes:
      - &finance_snapshot_input
        artifact_type: snapshot
        required: true
        multiple: true
        selector:
           dimensions: [market, fundamental, notice, capital_flow, sentiment, events, lhb, kline, macro, peers, chain, research, industry, materials, futures, valuation, governance, moat, trap, contests, sector, policy, fund_holders, similar_stocks]
    produces:
      - artifact_type: evidence_set
    requires_llm: true
    cost_class: medium
    latency_class: medium
    reliability: 0.85
    cache_scope: run
  - subagent_type: uzi_quick_scan_composer
    capability: finance.uzi.quick_scan.compose
    capability_version: "1"
    methodology_version: "3.9.4-source-parity"
    implementation: subagents.runtime:compose_uzi_quick_scan
    consumes:
      - *finance_snapshot_input
    produces:
      - artifact_type: quick_scan
    cost_class: low
    latency_class: low
    reliability: 0.9
    parallel_safe: true
    cache_scope: run
    tags: [intent:quick_scan]
  - subagent_type: uzi_native_analyze_stock
    capability: finance.uzi.native.analyze_stock
    capability_version: "1"
    methodology_version: "3.9.4-source-parity"
    implementation: subagents.runtime:execute_uzi_native_full_analysis
    consumes:
      - *finance_snapshot_input
      - artifact_type: normalized_query
        required: false
        multiple: false
      - artifact_type: stock_snapshot_bundle
        required: false
        multiple: false
    produces:
      - artifact_type: uzi_native_analysis
    requires_llm: true
    cost_class: medium
    latency_class: medium
    reliability: 0.9
    cache_scope: run
    tags: [uzi:native, command:analyze-stock]
  - subagent_type: uzi_native_report_composer
    capability: finance.uzi.native.report.compose
    capability_version: "1"
    methodology_version: "3.9.4-source-parity"
    implementation: subagents.runtime:compose_uzi_native_delivery
    consumes:
      - artifact_type: uzi_native_analysis
    produces:
      - artifact_type: research_report
    cost_class: low
    latency_class: low
    reliability: 0.99
    cache_scope: run
    tags: [uzi:native, command:analyze-stock]
  - subagent_type: stock_comparison_report_composer
    capability: finance.stock.compare.report.compose
    capability_version: "1"
    methodology_version: "3.9.4-source-parity"
    implementation: subagents.runtime:compose_stock_comparison_delivery
    consumes:
      - artifact_type: uzi_native_analysis
    produces:
      - artifact_type: research_report
    cost_class: low
    latency_class: low
    reliability: 0.99
    cache_scope: run
    tags: [intent:stock_compare]
  - subagent_type: uzi_native_portfolio_report_composer
    capability: finance.uzi.portfolio.report.compose
