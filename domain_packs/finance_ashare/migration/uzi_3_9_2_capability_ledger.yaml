tier1_extension:
  status: implemented_v1
  intent: portfolio_research
  capabilities:
    - finance.uzi.tier1.ai_readiness
    - finance.uzi.tier1.earnings_preview
    - finance.uzi.tier1.model_update
    - finance.uzi.tier1.returns_attribution
    - finance.uzi.tier1.holding_rebalance
  artifacts: [ai_readiness, earnings_preview, model_update, returns_attribution, holding_rebalance]
  frontend_route: /uzi-methods
  invariants:
    missing_return_imputation: forbidden
    implicit_fee_model: forbidden
    demo_model_updates: forbidden
    equal_weight_target: assumption_only

fund_extension:
  intent: fund_research
  status: implemented_v1
  capabilities:
    - finance.fund.snapshot.collect
    - finance.fund.analyze
    - finance.fund.report.compose
  artifacts: [fund_snapshot, fund_analysis, research_report]
  real_sources:
    - eastmoney_fund_catalog_via_akshare
    - eastmoney_fund_ranking_via_akshare
    - eastmoney_nav_via_akshare
    - eastmoney_fund_archives_holdings
  selection_gate:
    minimum_comparable_sample: 2
    minimum_score_coverage: 0.6
    missing_metric_imputation: forbidden

