integration_contracts:
  raw_data_shape:
    status: source_parity
    fields: [ticker, market, code, full, dimensions, fund_managers, similar_stocks]
    bonus_dimension_key: 6_fund_holders
    top_level_spill_fields: [fund_managers, similar_stocks]
    fund_stats_top_n_by_profile: {lite: 5, medium: 20, deep: 100}
  snapshot_cache:
    status: source_parity
    owner: Agent OS snapshot envelope mirrors raw_data dimension resume; vendored lib.cache owns provider sub-cache
    numbered_dimensions: reuse valid cached raw result without TTL expiry
    profile_partition: none for native numbered dimensions, matching ticker-level raw_data resume
    realtime_dimensions: [0_basic]
    always_refetched_bonus: [6_fund_holders, similar_stocks]
  collection_waves:
    status: source_parity_with_dependency_determinism
    canonical_upstream_path: skills/deep-analysis/scripts/run_real_test.py::collect_raw_data
    workers: 6
    wave_1: [0_basic]
    wave_2: profile_scoped_numbered_fetchers
    wave_2_overall_timeout_seconds: 300
    wave_2_default_fetcher_timeout_seconds: 90
    wave_2_fetcher_timeout_overrides_seconds: {6_research: 180, 1_financials: 150, 10_valuation: 150, 15_events: 120}
    wave_3_bonus: [6_fund_holders, similar_stocks]
    wave_3_workers: 2
    wave_3_overall_timeout_seconds: 180
    wave_3_fetcher_timeout_seconds: 120
    timeout_semantics: upstream_completion_classification_window_not_hard_thread_cancellation
    host_transport_guard: context-scoped requests default timeout 20s propagated into nested UZI executor tasks; peer Agent OS traffic is unaffected
    long_running_worker_risk: a provider performing many bounded requests may finish after the classification window because Python threads cannot be force-cancelled
    deterministic_dependency: 9_futures waits for 8_materials inside wave_2
    upstream_root_pipeline_note: lib.pipeline.collect uses a different non-dependent/dependent split; the raw-result DomainPack boundary follows collect_raw_data because it preserves the advertised profile and native fetcher result contract
  self_review_compatibility_view:
    status: upstream_bug_compatibility
    original_evidence_mutated: false
    nullable_string_defaults:
      - dimensions.0_basic.data.industry
      - dimensions.7_industry.data.cninfo_metrics.industry_name_match
    dcf_output_alias:
      producer: intrinsic_per_share
      upstream_self_review_reader: intrinsic_value_per_share
  panel_only:
    status: source_parity
    output: [dimensions, panel, synthesis]

