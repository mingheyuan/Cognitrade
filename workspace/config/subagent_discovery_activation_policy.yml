defaults:
  auto_activate: false
  require_approved_ticket: true
  require_recommended_candidate: true
  require_single_runtime_registration_template: true
  max_candidate_count: 1
  allowed_side_effect_levels:
    - none
    - read_only

rules:
  - rule_id: collect_skill_auto_activate
    stage: collect
    auto_activate: true
    allow_recommended_candidate_override: true
    allowed_protocols:
      - skill
    notes:
      - auto_activate_safe_collect_skill_preview
  - rule_id: report_skill_auto_activate
    stage: report
    auto_activate: true
    allow_recommended_candidate_override: true
    allowed_protocols:
      - skill
    notes:
      - auto_activate_safe_report_skill_preview
  - rule_id: retrieve_read_only_auto_activate
    stage: retrieve
    auto_activate: true
    allow_recommended_candidate_override: true
    allowed_protocols:
      - mcp
      - openapi
      - http_json
    notes:
      - auto_activate_safe_retrieve_read_only_preview
  - rule_id: review_read_only_auto_activate
    stage: review
    auto_activate: true
    allow_recommended_candidate_override: true
    allowed_protocols:
      - mcp
      - openapi
    notes:
      - auto_activate_safe_review_read_only_preview
