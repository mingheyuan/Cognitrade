name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strategy-contracts:
    name: Strategy SQLite/PostgreSQL contracts and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cognitrade
          POSTGRES_USER: cognitrade
          POSTGRES_PASSWORD: cognitrade-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cognitrade -d cognitrade"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      COGNITRADE_TEST_POSTGRES_URL: postgresql+psycopg://cognitrade:cognitrade-ci@127.0.0.1:5432/cognitrade
      COGNITRADE_API_ALLOW_UNAUTHENTICATED: "true"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Validate reversible PostgreSQL migration chain
        env:
          COGNITRADE_DATABASE_URL: ${{ env.COGNITRADE_TEST_POSTGRES_URL }}
        run: |
          python -m alembic -c alembic.ini upgrade head
          python -m alembic -c alembic.ini downgrade base
          python -m alembic -c alembic.ini upgrade head
          python -m alembic -c alembic.ini check
      - name: Run cross-dialect repository and deployment contracts
        run: >-
          python -m unittest -v
          tests.test_strategy_database_contract
          tests.test_strategy_migration_deployment
          tests.test_strategy_legacy_retention

  finance-contracts:
    name: Finance chain and scoring contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COGNITRADE_API_ALLOW_UNAUTHENTICATED: "true"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      # Native finance/UZI dependencies keep process-wide state. Keep the
      # command/method/report contracts in a fresh interpreter so an earlier
      # provider test cannot strand their worker initialization.
      - name: Validate API, planning, fund scoring, and core UZI runtime contracts
        run: >-
          python -m unittest
          tests.test_api_validation_dynamic
          tests.test_agent_os_task_intake
          tests.test_pack_planner_contracts
          tests.test_finance_pack_migration_completion
          tests.test_finance_ashare_dashboard_contract
          tests.test_fund_research
          tests.test_api_v1_fund_holding_reports
          tests.test_api_v2_finance
          tests.test_backtest_strategies
          tests.test_uzi_392_vendor_runtime
          tests.test_uzi_snapshot_runtime_parity
          tests.test_uzi_source_parity
      - name: Validate UZI commands, methods, reports, providers, and frontend contracts
        run: >-
          python -m unittest
          tests.test_uzi_392_commands
          tests.test_uzi_392_native_methods
          tests.test_uzi_392_analysis
          tests.test_uzi_quick_scan
          tests.test_uzi_strict_recovery
          tests.test_uzi_native_report
          tests.test_uzi_provider_smoke
          tests.test_finance_artifact_ui_contracts

  backend:
    name: Complete backend suite
    needs: finance-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COGNITRADE_API_ALLOW_UNAUTHENTICATED: "true"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Run complete backend suite with native crash diagnostics
        # Several native UZI/provider dependencies keep process-wide state.
        # Isolate every test module while retaining the complete test inventory.
        run: |
          suite_status=0
          for test_file in tests/test_*.py; do
            test_pattern="${test_file#tests/}"
            python -X faulthandler -m unittest discover -v -s tests -p "$test_pattern" || suite_status=1
          done
          exit "$suite_status"

  uzi-upstream-tests:
    name: Pinned UZI suite against vendored implementation
    needs: finance-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wbh604/UZI-Skill
          ref: b004d7a988ca53a4805bf36784af091fa1209f22
          path: upstream-uzi
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest
      - name: Verify vendored scope against the pristine pinned checkout
        env:
          UZI_UPSTREAM_ROOT: ${{ github.workspace }}/upstream-uzi
        run: python -m unittest -v tests.test_uzi_checkout_parity
      - name: Overlay vendored modules onto the fixed upstream test tree
        run: >-
          rsync -a
          domain_packs/finance_ashare/vendor/uzi_3_9_2/scripts/
          upstream-uzi/skills/deep-analysis/scripts/
      - name: Run deterministic upstream tests with vendored UZI modules
        env:
          # Upstream self-review treats GitHub's implicit CI=true as CLI-only,
          # while its medium-profile regression tests expect normal agent mode.
          CI: "false"
        working-directory: upstream-uzi/skills/deep-analysis/scripts
        # The two process-runner tests are wall-clock microbenchmarks with
        # 1.0-second spawn budgets. Hosted runners exceeded those budgets while
        # byte parity and the scheduler behavior remained correct, so the same
        # semantics are covered below with Cognitrade's production-safe budget.
        run: python -m pytest -q tests --ignore=tests/pipeline/test_process_runner.py
      - name: Validate process scheduler with platform-safe production budgets
        run: >-
          python -m unittest -v
          tests.test_uzi_392_vendor_runtime.Uzi392VendorRuntimeTests.test_process_runner_enforces_hard_timeout_with_platform_startup_budget
          tests.test_uzi_392_vendor_runtime.Uzi392VendorRuntimeTests.test_process_runner_serializes_groups_with_platform_startup_budget

  provider-smoke:
    name: UZI real-provider smoke
    needs: finance-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COGNITRADE_API_ALLOW_UNAUTHENTICATED: "true"
      COGNITRADE_SENSITIVE_SOURCES_ENABLED: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Probe all 22 UZI dimensions with real configured providers
        run: >-
          python -m research_system.runtime.diagnostics.status.uzi_provider_smoke
          --symbol 600519
          --sector 白酒
          --dimension-timeout-seconds 35
          --output ci-artifacts/uzi-provider-smoke.json
      - name: Upload redacted provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uzi-provider-smoke-${{ github.sha }}
          path: ci-artifacts/uzi-provider-smoke.json
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend lint, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
