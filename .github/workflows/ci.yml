name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strategy-contracts:
    name: Strategy SQLite/PostgreSQL contracts and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cognitrade
          POSTGRES_USER: cognitrade
          POSTGRES_PASSWORD: cognitrade-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cognitrade -d cognitrade"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      COGNITRADE_TEST_POSTGRES_URL: postgresql+psycopg://cognitrade:cognitrade-ci@127.0.0.1:5432/cognitrade
      COGNITRADE_API_ALLOW_UNAUTHENTICATED: "true"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Validate reversible PostgreSQL migration chain
        env:
          COGNITRADE_DATABASE_URL: ${{ env.COGNITRADE_TEST_POSTGRES_URL }}
        run: |
          python -m alembic -c alembic.ini upgrade head
          python -m alembic -c alembic.ini downgrade base
          python -m alembic -c alembic.ini upgrade head
          python -m alembic -c alembic.ini check
      - name: Run cross-dialect repository and deployment contracts
        run: >-
          python -m unittest -v
          tests.test_strategy_database_contract
          tests.test_strategy_migration_deployment
          tests.test_strategy_legacy_retention

  backend:
    name: Complete backend suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COGNITRADE_API_ALLOW_UNAUTHENTICATED: "true"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest
      - name: Verify generated Finance Artifact inventory is current
        run: python scripts/generate_finance_artifact_contracts.py --check
      - name: Run Point-in-Time market-data and fund-holding contracts
        run: python -m pytest -q tests/market_data
      - name: Run complete backend suite with native crash diagnostics
        # Several native UZI/provider dependencies keep process-wide state.
        # Isolate every test module while retaining the complete test inventory.
        run: |
          suite_status=0
          for test_file in tests/test_*.py; do
            test_pattern="${test_file#tests/}"
            # These run once in the PostgreSQL job, which also exercises their
            # SQLite paths. Do not repeat them in the generic backend sweep.
            case "$test_pattern" in
              test_strategy_database_contract.py|test_strategy_migration_deployment.py|test_strategy_legacy_retention.py)
                continue
                ;;
            esac
            module_status=0
            echo "::group::$test_pattern"
            timeout --signal=TERM --kill-after=10s 180s \
              python -X faulthandler -m unittest discover -v -s tests -p "$test_pattern" || module_status=$?
            if [[ "$module_status" -eq 124 || "$module_status" -eq 137 ]]; then
              echo "::warning::$test_pattern did not exit within 180s; retrying once in a fresh process"
              module_status=0
              timeout --signal=TERM --kill-after=10s 180s \
                python -X faulthandler -m unittest discover -v -s tests -p "$test_pattern" || module_status=$?
            fi
            echo "::endgroup::"
            if [[ "$module_status" -ne 0 ]]; then
              suite_status=1
            fi
          done
          exit "$suite_status"

  uzi-upstream-tests:
    name: Pinned UZI suite against vendored implementation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wbh604/UZI-Skill
          ref: b3665e85b8666477038e11157d8e8feb0e006b76
          path: upstream-uzi
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest
      - name: Verify vendored scope against the pristine pinned checkout
        env:
          UZI_UPSTREAM_ROOT: ${{ github.workspace }}/upstream-uzi
        run: python -m unittest -v tests.test_uzi_checkout_parity
      - name: Overlay vendored modules onto the fixed upstream test tree
        run: >-
          rsync -a
          domain_packs/finance_ashare/vendor/uzi_3_9_2/scripts/
          upstream-uzi/skills/deep-analysis/scripts/
      - name: Run deterministic upstream tests with vendored UZI modules
        env:
          # Upstream self-review treats GitHub's implicit CI=true as CLI-only,
          # while its medium-profile regression tests expect normal agent mode.
          CI: "false"
        working-directory: upstream-uzi/skills/deep-analysis/scripts
        # The process-runner microbenchmarks use 1-second spawn budgets that are
        # unreliable on hosted runners. The backend suite covers the same
        # scheduler behavior with Cognitrade's production-safe budget.
        run: python -m pytest -q tests --ignore=tests/pipeline/test_process_runner.py

  provider-smoke:
    name: Manual UZI real-provider smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COGNITRADE_API_ALLOW_UNAUTHENTICATED: "true"
      COGNITRADE_SENSITIVE_SOURCES_ENABLED: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Probe all 22 UZI dimensions with real configured providers
        run: >-
          python -m research_system.runtime.diagnostics.status.uzi_provider_smoke
          --symbol 600519
          --sector 白酒
          --dimension-timeout-seconds 35
          --output ci-artifacts/uzi-provider-smoke.json
      - name: Upload redacted provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uzi-provider-smoke-${{ github.sha }}
          path: ci-artifacts/uzi-provider-smoke.json
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend lint, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
